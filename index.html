<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .layout {
            width: 100%;
        }
        .readout {
            text-align: center;
            font-weight: 700;
            font-size: 25px;
        }
        .cells {
            margin: 0 auto;
            display: flex;
            width: 740px;
            flex-wrap: wrap;
        }
        .item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 145px;
            height: 145px;
            margin: 7px;
            border: 4px solid #1a1a1a;
            background: #b22222;
            color: #ffffff;
            font-size: 21px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }
        .item.chosen {
            background: #228b22;
            color: #08140a;
            border-color: #0a4f0a;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="readout">
            <p>Сумма чисел: <span id="sumLine">0</span></p>
            <p>Всего ячеек отмечено: <span id="countLine">0</span></p>
        </div>
        <div class="cells">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
            <div class="item">7</div>
            <div class="item">8</div>
            <div class="item">9</div>
            <div class="item">10</div>
            <div class="item">11</div>
            <div class="item">12</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
